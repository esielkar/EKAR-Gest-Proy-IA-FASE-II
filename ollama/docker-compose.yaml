services:
  ollama:
    image: ollama/ollama:latest

    container_name: ollama

    restart: always

    ports:
      - "15434:11434"

    environment:
      - OLLAMA_KEEP_ALIVE=15m

      - OLLAMA_HOST=0.0.0.0

      - OLLAMA_ORIGINS=*

    volumes:
      - ./data:/root/.ollama

    deploy:
      resources:
        limits:
          memory: 12G

    networks:
      - internet

networks:
  internet:
    external: true
